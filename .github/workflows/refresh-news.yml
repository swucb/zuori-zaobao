name: 更新每日早报

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 生成当日新闻快照
        run: node --experimental-strip-types scripts/generate-news.ts
      - name: 阅读原文并生成中文摘要
        continue-on-error: true
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SUMMARY_MODEL: glm-4.7-flash
        run: node --experimental-strip-types scripts/enrich-summaries.ts
      - name: 保存当天早报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-site/news.json
          if ! git diff --cached --quiet; then
            git commit -m "更新每日早报 [skip ci]"
            git push
          fi
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
