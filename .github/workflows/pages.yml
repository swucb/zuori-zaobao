name: 每日早报与 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  models: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 生成当日新闻快照
        run: node --experimental-strip-types scripts/generate-news.ts
      - name: 阅读原文并生成中文摘要
        continue-on-error: true
        env:
          GH_MODELS_TOKEN: ${{ github.token }}
          SUMMARY_MODEL: openai/gpt-4.1-mini
        run: node --experimental-strip-types scripts/enrich-summaries.ts
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
